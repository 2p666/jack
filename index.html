<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08060e">
  <title>Para Mel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="scene">
    <div class="moon" aria-hidden="true"></div>
    <div class="hill" aria-hidden="true"></div>
    <p class="label">UMA LUZ PARA QUANDO A NOITE CHEGAR</p>
    <h1 class="phrase" aria-label="Eu te amo">
      <span class="letter e-bounce">E</span>
      <span class="letter u-spin">u</span>
      <span class="space" aria-hidden="true"></span>
      <span class="letter t-fall">t</span>
      <span class="letter e-bat" id="batLetter">e</span>
      <span class="space" aria-hidden="true"></span>
      <span class="letter a-moon">a</span>
      <span class="letter m-unfold">m</span>
      <span class="letter o-drift">o</span>
    </h1>
    <img id="flyingBat" class="flying-bat" src="assets/bats/bat-1.svg" alt="" aria-hidden="true">
    <button id="openCamera" class="camera-button" type="button">Mostrar a luminária</button>
    <p class="subtitle">uma pequena coisa viva, feita para você</p>
  </main>

  <dialog id="cameraDialog" class="camera-dialog">
    <section class="camera-card">
      <button id="closeCamera" class="close-button" type="button" aria-label="Fechar câmera">×</button>
      <p class="eyebrow">PORTAL DA LUMINÁRIA</p>
      <h2>Mostre a luz.</h2>
      <p id="cameraStatus">Permita o uso da câmera e aponte para a frente da luminária.</p>
      <div class="camera-stage">
        <video id="cameraFeed" autoplay playsinline muted></video>
        <div class="target-frame" aria-hidden="true"></div>
        <div id="detectedSeal" class="detected-seal">✦ reconhecida ✦</div>
      </div>
      <button id="enterPortal" class="portal-button" type="button" disabled>Entrar em Halloween Town</button>
      <p class="camera-note">Teste atual: enquadre a luminária de frente, com boa luz e sem reflexos fortes.</p>
    </section>
  </dialog>

  <canvas id="visionCanvas" hidden></canvas>
  <img id="lampReference" src="assets/luminaria-referencia.jfif" alt="">
  <script src="app.js"></script>
</body>
</html>
